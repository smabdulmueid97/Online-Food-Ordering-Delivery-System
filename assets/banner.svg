<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Online Food Ordering and Delivery System — order online, pay with PayPal, get it delivered">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F97316"/>
      <stop offset="1" stop-color="#7C2D12"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFF1E6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <circle cx="1060" cy="55" r="90" fill="#FFFFFF" opacity="0.08"/>
  <circle cx="105" cy="305" r="70" fill="#FFFFFF" opacity="0.08"/>
  <circle cx="990" cy="305" r="40" fill="#FFFFFF" opacity="0.10"/>
  <text x="60" y="86" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="bold" fill="#FFFFFF">Online Food Ordering</text>
  <text x="60" y="134" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="bold" fill="#FFFFFF">&amp; Delivery System</text>
  <text x="60" y="176" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#FFE3CC">Order online. Pay with PayPal. Get it delivered.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="60" y="205" width="110" height="54" rx="27" fill="#FFFFFF"/>
    <text x="115" y="240" font-size="22" font-weight="bold" fill="#7C2D12" text-anchor="middle">PHP</text>
    <rect x="186" y="205" width="130" height="54" rx="27" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="251" y="240" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">MySQL</text>
    <rect x="332" y="205" width="140" height="54" rx="27" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="402" y="240" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PayPal</text>
  </g>
  <g>
    <rect x="700" y="150" width="440" height="130" rx="16" fill="url(#card)"/>
    <text x="730" y="192" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#7C2D12">1. Create database sshb</text>
    <text x="730" y="226" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#7C2D12">2. Import sshb.sql</text>
    <text x="730" y="262" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#444444">Admin demo login: a@a.a / 1234</text>
  </g>
  <text x="60" y="320" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#FBD9BE">Customer shop + cart + admin panel  •  PHP &amp; MySQL</text>
</svg>
